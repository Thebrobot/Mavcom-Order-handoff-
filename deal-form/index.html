    <link rel="preconnect" href="https://link.msgsndr.com" crossorigin />

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- LeadConnector: forwards host page ?email= (etc.) into embedded form iframes; iframe src alone is not enough for prefill. -->

    <!--
      GoHighLevel Chat Widget (Brobot rep assistant knowledge base bot).
      Widget Placement is Embedded/Inline — Copilot opens it centered on the page.
    -->
    <style>
      chat-widget {
        position: fixed !important;
        top: 50% !important;
        left: 50% !important;
        right: auto !important;
        bottom: auto !important;
        transform: translate(-50%, -50%) !important;
        z-index: 2147483000;
        width: min(620px, calc(100vw - 32px)) !important;
        height: min(592px, calc(100dvh - 32px)) !important;
        max-height: calc(100dvh - 32px);
        display: none;
        overflow: hidden;
        border-radius: 16px;
        box-shadow: 0 24px 64px rgba(15, 23, 42, 0.35);
      }
      chat-widget.mb-chat-open {
        display: block;
      }
    </style>
    <script src="https://widgets.leadconnectorhq.com/loader.js" data-resources-url="https://widgets.leadconnectorhq.com/chat-widget/loader.js" data-widget-id="6a8cb105413c619641a2fef0"></script>
